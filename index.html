<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Detect the path this app is deployed under (e.g. behind a reverse-proxy
        // subpath) purely from the current URL, and inject a <base> tag so every
        // relative asset/link below resolves correctly. No build-time or runtime
        // configuration needed. Must run before any other tag in <head>.
        (function () {
            var path = location.pathname;
            var suffixes = [
                /\/status-page\/?$/,
                /\/status\/[^/]+\/rss\/?$/,
                /\/status\/[^/]+\/?$/,
                /\/status\/?$/,
            ];
            for (var i = 0; i < suffixes.length; i++) {
                if (suffixes[i].test(path)) {
                    path = path.replace(suffixes[i], "/");
                    break;
                }
            }
            if (path.slice(-1) !== "/") {
                path += "/";
            }
            var base = document.createElement("base");
            base.href = path;
            document.head.appendChild(base);
        })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" id="theme-color" content="" />
    <meta name="description" content="Uptime Komo monitoring tool" />
    <title>Uptime Komo</title>
    <style>
        .noscript-message {
            font-size: 20px;
            text-align: center;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    Sorry, you don't seem to have JavaScript enabled or your browser
    doesn't support it.<br />This website requires JavaScript to function.
    Please enable JavaScript in your browser settings to continue.
</div>
</noscript>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
